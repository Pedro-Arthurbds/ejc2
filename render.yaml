# Configuração do Render (Blueprint) gratuita: só o site. O banco fica em outro serviço (Neon, Supabase...)
# e você cola a URL dele em DATABASE_URL quando o Render pedir.
# O site "dorme" após 15 min sem acesso (leva cerca de 1 min para acordar). Veja o README.
services:
  - type: web
    name: balada-ejc
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: VAGAS
        value: "120"
      # Os valores abaixo o Render pede para você preencher na criação (não ficam no GitHub).
      - key: ADMIN_PASSWORD
        sync: false
      - key: PIX_CHAVE
        sync: false
      - key: PIX_RECEBEDOR
        value: EJC Itarana
      - key: PIX_CIDADE
        value: Itarana
      - key: VALOR_POR_PESSOA
        sync: false
      - key: SHEETS_WEBHOOK_URL
        sync: false
      - key: SHEETS_SECRET
        sync: false